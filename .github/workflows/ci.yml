name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend (compile + seed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile app/*.py app/**/*.py

      - name: Deterministic seed check
        run: |
          python -m app.seed
          python -c "
          import sqlite3
          con = sqlite3.connect('setu.db')
          cur = con.cursor()

          cur.execute(\"SELECT username, role FROM users ORDER BY id\")
          users = cur.fetchall()
          assert users == [
              ('rahul', 'citizen'),
              ('priya', 'citizen'),
              ('officer', 'officer'),
          ], f'Unexpected seeded users: {users}'

          cur.execute(\"SELECT status FROM applications WHERE id = 1\")
          assert cur.fetchone()[0] == 'ready_for_processing', 'Rahul (application 1) did not auto-resolve'

          cur.execute(\"SELECT status FROM applications WHERE id = 2\")
          assert cur.fetchone()[0] == 'identity_review', 'Priya (application 2) did not land in identity review'

          cur.execute(
              \"SELECT confidence_score FROM identity_matches WHERE application_id = 2 AND department = 'health'\"
          )
          score = cur.fetchone()[0]
          assert 55 <= score < 90, f'Priya Health confidence {score} outside expected pending_review band'

          print(f'Seed check passed: Rahul ready_for_processing, Priya identity_review (health={score}%)')
          "
